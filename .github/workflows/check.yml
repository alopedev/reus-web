# every push and pull request: types, build, and the design checks in a real (software-rendered) browser
name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_datos.py   # the network timetable (data/red.json), in seconds
      - run: npm ci
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:paridad
      - run: python scripts/check.py
        env:
          PARIDAD_VOLCAR: '1'
      # TEMPORARY: the CI's own hero frames, as a difference from the reference in the repo, printed to the log
      - if: always()
        run: |
          python - <<'PY'
          import base64, zlib
          from PIL import Image
          for name in ("escritorio-hero", "movil-hero"):
              a = Image.open(f"screenshots/{name}-ci.png").convert("RGB").tobytes()
              b = Image.open(f"scripts/baseline/linux/{name}.png").convert("RGB").tobytes()
              d = base64.b64encode(zlib.compress(bytes((x - y) % 256 for x, y in zip(a, b)), 9)).decode()
              print(f"VOLCADO {name} {len(d)}")
              for i in range(0, len(d), 3000): print(f"V{i // 3000:04d} {d[i:i + 3000]}")
              print(f"FIN {name}")
          PY
      # the screenshots, and any reference frame written in this run, to review or commit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            screenshots/
            scripts/baseline/linux/
          if-no-files-found: ignore
