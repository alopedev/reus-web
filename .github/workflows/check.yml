# every push and pull request: types, build, and the design checks in a real (software-rendered) browser
name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_datos.py   # the network timetable (data/red.json), in seconds
      - run: npm ci
      - run: npm test             # the rules of which train is shown (src/shown.ts), in a second
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:paridad
      - run: python scripts/check.py
      # TEMPORARY (Avui · Demà): prints the difference between each hero frame that fails and the reference committed
      # from the cloud, so the CI's own frame can be rebuilt there; removed in the commit that brings the frames
      - if: always()
        run: |
          python - <<'PY'
          import base64, zlib, pathlib
          from PIL import Image, ImageChops
          for n in ("escritorio-hero", "movil-hero"):
              shot = pathlib.Path(f"screenshots/{n}-distinto.png")
              if not shot.exists(): print(n, "same"); continue
              a = Image.open(shot).convert("RGB"); b = Image.open(f"scripts/baseline/linux/{n}.png").convert("RGB")
              d = bytes((x - y) % 256 for x, y in zip(a.tobytes(), b.tobytes()))
              z = base64.b64encode(zlib.compress(d, 9)).decode()
              print(f"DIFF {n} {a.width}x{a.height} {len(z)}")
              for i in range(0, len(z), 4000): print(f"D {n} {z[i:i+4000]}")
          PY
      # the screenshots, and any reference frame written in this run, to review or commit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            screenshots/
            scripts/baseline/linux/
          if-no-files-found: ignore
