# every push and pull request: types, build, and the design checks in a real (software-rendered) browser
name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_datos.py   # the network timetable (data/red.json), in seconds
      - run: npm ci
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:paridad
      - run: python scripts/check.py
      # TEMPORARY (the Open-Meteo credit changes the back of the ticket): the new escritorio-mesa frame, as its
      # difference from the reference in the repo, printed to the log; removed in the commit that renews the reference
      - if: always()
        run: |
          python - <<'PY'
          import base64, zlib, pathlib
          from PIL import Image
          new = pathlib.Path("screenshots/escritorio-mesa-distinto.png")
          if new.exists():
              a = Image.open(new).convert("RGB").tobytes(); b = Image.open("scripts/baseline/linux/escritorio-mesa.png").convert("RGB").tobytes()
              d = base64.b64encode(zlib.compress(bytes((x - y) % 256 for x, y in zip(a, b)), 9)).decode()
              print("DIFFLEN", len(d))
              for i in range(0, len(d), 8000): print("DIFF", i // 8000, d[i:i + 8000])
          PY
      # the screenshots, and any reference frame written in this run, to review or commit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            screenshots/
            scripts/baseline/linux/
          if-no-files-found: ignore
