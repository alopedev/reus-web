# temporary: diagnose the 22-10 parity failure with Renfe's real feeds (blocked from the cloud session)
name: diag
on:
  push:
    branches: [claude/horarios-2026-10-22]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: curl -sSfL -o /tmp/avld.zip https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip && curl -sSfL -o /tmp/fom.zip https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip
      - run: python scripts/extract_trains.py && python scripts/extract_red.py --fomento /tmp/fom.zip --avld /tmp/avld.zip
      - run: python scripts/check_datos.py || true
      - run: python .github/diag/paridad.py /tmp/avld.zip /tmp/fom.zip
